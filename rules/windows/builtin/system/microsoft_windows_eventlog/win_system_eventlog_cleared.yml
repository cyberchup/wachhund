    service: system
    definition: 'Requirements: System event log collection from the host'
detection:
    selection:
        EventID: 104
        Provider_Name: 'Microsoft-Windows-Eventlog'
    condition: selection
falsepositives:
    - Log collection agents whose setup routine clears the local event logs
    - Preparing a system image, where the logs are cleared before capture
    - Software or administrators clearing an application's own log
