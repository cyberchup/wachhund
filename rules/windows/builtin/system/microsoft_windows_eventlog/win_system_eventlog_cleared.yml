    - https://github.com/redcanaryco/atomic-red-team/blob/11ff111ace63e02825dd44ce8246800203a10ce8/atomics/T1685.005/T1685.005.yaml
author: Florian Roth (Nextron Systems), Tim Shelton, Nasreddine Bencherchali (Nextron Systems), cyberchup
