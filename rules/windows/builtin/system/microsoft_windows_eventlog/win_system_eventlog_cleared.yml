title: Potential Clearing of a Windows Event Log
id: 02084411-f693-4a17-9775-c64d69084015
related:
    - id: a62b37e0-45d3-48d9-a517-90c1a1b0186b
      type: derived
    - id: 100ef69e-3327-481c-8e5c-6d80d9507556
      type: derived
status: experimental
description: |
    Detects a Windows event log being cleared, which Windows records as event 104 in the System log ("The <name> log file was cleared").
    Attackers clear logs such as System, Sysmon or PowerShell to remove evidence, for example with wevtutil cl or Clear-EventLog.
    It covers every log except Security, whose clearing is event 1102 and has its own rule.
    The rule doesn't tell important logs apart from others: the cleared log's name is only in the event data, which Elastic and Kusto don't expose under the same field.
