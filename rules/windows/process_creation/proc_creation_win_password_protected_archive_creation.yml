title: Potential Password-Protected Archive Creation via 7-Zip, RAR or WinZip
id: ab5a3568-8dfb-413d-9c20-66dbd4235c10
related:
    - id: 9fbf5927-5261-4284-a71d-f681029ea574
      type: derived
    - id: faa48cae-6b25-4f00-a094-08947fef582f
      type: derived
    - id: e2e80da2-8c66-4e00-ae3c-2eebd29f6b6d
      type: derived
status: experimental
description: |
    Detects 7-Zip, RAR or WinZip creating or updating an archive with a password from the command line: 7-Zip's -p, RAR's -p or -hp (which also hides the file names), and WinZip's -s.
    Attackers stage collected data in an encrypted archive before exfiltrating it, so that data loss prevention and network inspection can't see what leaves. Ransomware crews and espionage actors commonly do this with 7-Zip or RAR.
    It merges three SigmaHQ rules, one per archiver, and requires the archiver's own process, so a shell that merely launches it doesn't match a second time. Extracting a protected archive doesn't match.
license: DRL-1.1
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1560.001/T1560.001.yaml
    - https://labs.sentinelone.com/the-anatomy-of-an-apt-attack-and-cobaltstrike-beacons-encoded-configuration/
    - https://github.com/SigmaHQ/sigma/blob/e3f466211866e92553d8389d621ed13cfed5523d/rules/windows/process_creation/proc_creation_win_7zip_password_compression.yml
    - https://github.com/SigmaHQ/sigma/blob/e3f466211866e92553d8389d621ed13cfed5523d/rules/windows/process_creation/proc_creation_win_rar_compression_with_password.yml
    - https://github.com/SigmaHQ/sigma/blob/e3f466211866e92553d8389d621ed13cfed5523d/rules/windows/process_creation/proc_creation_win_winzip_password_compression.yml
author: frack113, @ROxPinTeddy, cyberchup
date: 2026-10-20
tags:
    - attack.collection
    - attack.t1560.001
logsource:
    category: process_creation
    product: windows
    definition: 'Requirements: Sysmon EID 1 or Security 4688 with command-line auditing'
detection:
    selection_7zip_img:
        - Description|contains: '7-Zip'
        - Image|endswith:
              - '\7z.exe'
              - '\7za.exe'
              - '\7zr.exe'
        - OriginalFileName:
              - '7z.exe'
              - '7za.exe'
              - '7zr.exe'
    selection_7zip_password:
        CommandLine|contains: ' -p'
    selection_7zip_action:
        CommandLine|contains:
            - ' a '
            - ' u '
    selection_rar_img:
        Image|endswith:
            - '\rar.exe'
            - '\winrar.exe'
    selection_rar_password:
        CommandLine|contains:
            - ' -hp'
            - ' -p'
    selection_rar_action:
        CommandLine|contains:
            - ' a '
            - ' m '
            - ' u '
    selection_winzip_img:
        Image|endswith:
            - '\winzip32.exe'
            - '\winzip64.exe'
    selection_winzip_password:
        CommandLine|contains: ' -s'
    selection_winzip_action:
        CommandLine|contains: ' -a '
    selection_wzzip_img:
        Image|endswith: '\wzzip.exe'
    selection_wzzip_password:
        CommandLine|contains: ' -s'
    condition: all of selection_7zip_* or all of selection_rar_* or all of selection_winzip_* or all of selection_wzzip_*
falsepositives:
    - Users and backup or file transfer scripts that protect archives with a password
    - Build and packaging scripts that produce encrypted archives
level: medium
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_password_protected_archive_creation/info.yml
