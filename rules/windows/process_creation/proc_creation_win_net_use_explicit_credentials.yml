title: Potential Share Connection with Explicit Credentials via Net.EXE
id: 0a4e16ca-5e26-49c0-8139-01de7a599103
related:
    - id: d4498716-1d52-438f-8084-4a603157d131
      type: derived
status: experimental
description: |
    Detects net.exe or net1.exe connecting to a network share with a user name on the command line (/user: or its short form /u:).
    Attackers do this to authenticate with stolen or guessed credentials, for example in password-guessing loops against a domain controller's IPC$ share, and usually pass the password on the same command line.
    The rule doesn't check for the password itself: Sigma can't express "a password follows the user name" in a form that converts the same way for Elastic and Kusto.
license: DRL-1.1
references:
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/gg651155(v=ws.11)
    - https://github.com/SigmaHQ/sigma/blob/34c5d66c22bbe41fe701cb6341d78ce324e6b24a/rules/windows/process_creation/proc_creation_win_net_use_password_plaintext.yml
    - https://github.com/redcanaryco/atomic-red-team/blob/44cd7ff8f1fc938e7d4a29606b87bc9c6e2b7ea0/atomics/T1110.001/T1110.001.yaml
author: Tim Shelton (HAWK.IO), cyberchup
date: 2026-10-06
tags:
    - attack.credential-access
    - attack.t1110.001
    - attack.lateral-movement
    - attack.t1021.002
logsource:
    category: process_creation
    product: windows
    definition: 'Requirements: Sysmon EID 1 or Security 4688 with command-line auditing'
detection:
    selection_img:
        - Image|endswith:
              - '\net.exe'
              - '\net1.exe'
        - OriginalFileName:
              - 'net.exe'
              - 'net1.exe'
    selection_cli_use:
        CommandLine|contains: ' use '
    selection_cli_user:
        CommandLine|contains:
            - '/user:'
            - '/u:'
    condition: all of selection_*
falsepositives:
    - Administrators connecting to a remote host's admin shares with a separate admin account before running remote management tools
    - Scripts that map drives to NAS devices or workgroup servers with a dedicated local account
    - Interactive use where the command line leaves out the password and net.exe prompts for it
level: medium
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_net_use_explicit_credentials/info.yml
simulation:
    - type: atomic-red-team
      name: Brute Force Credentials of single Active Directory domain users via SMB
      technique: T1110.001
      atomic_guid: 09480053-2f98-4854-be6e-71ae5f672224
