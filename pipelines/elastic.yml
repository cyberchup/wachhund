# Custom Elastic field mappings. Runs before the built-in pipeline (priority 10 vs
# ecs_windows' 20), so a mapping here overrides the built-in one for that field.
#
# Add a mapping when tests/convert_rules.py reports an unmapped field. Map to the field
# name that hauslab's Elastic data actually uses; check a real document before adding one.
# Example, if hauslab ships Sysmon through Elastic Agent and keeps the value under
# winlog.event_data:
#
#     - id: elastic_custom_process_creation
#       type: field_name_mapping
#       mapping:
#           IntegrityLevel: winlog.event_data.IntegrityLevel
#       rule_conditions:
#           - type: logsource
#             category: process_creation
#             product: windows
name: custom_elastic
priority: 10
transformations:
    # ecs_windows maps these to `.caseless` multi-fields (process.executable.caseless, ...),
    # a workaround for Lucene's case-sensitive matching. EQL already compares
    # case-insensitively, and an EQL query that names a field the searched indices don't
    # map fails instead of matching nothing. Only some indices (Elastic Defend's) map
    # `.caseless`, so query the base ECS fields.
    - id: elastic_custom_no_caseless
      type: field_name_mapping
      mapping:
          Image: process.executable
          ParentImage: process.parent.executable
          SourceImage: process.executable
          Destination: process.executable
          Application: process.executable
          NewProcessName: process.executable
          ParentProcessName: process.parent.name
          ProcessName: process.executable
      rule_conditions:
          - type: logsource
            product: windows
