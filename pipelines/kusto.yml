# Custom Kusto field mappings. Runs before the built-in pipelines (priority 5 vs
# microsoft_xdr's and azure_monitor's 10), so a mapping here overrides the built-in one.
#
# Add a mapping when tests/convert_rules.py reports a field the target table doesn't
# have. Map to a column of the table the rule converts to (the error lists them).
# Example:
#
#     - id: kusto_custom_process_creation
#       type: field_name_mapping
#       mapping:
#           SomeSigmaField: ProcessCommandLine
#       rule_conditions:
#           - type: logsource
#             category: process_creation
#             product: windows
name: custom_kusto
priority: 5
transformations:
    # Windows Security log rules query Sentinel's SecurityEvent table. azure_monitor only
    # picks a table from a rule's category (process_creation, ...), so a rule with
    # `service: security` needs the table set here.
    - id: kusto_custom_security_table
      type: set_state
      key: query_table
      val: SecurityEvent
      rule_conditions:
          - type: logsource
            product: windows
            service: security
    # SecurityEvent keeps the event's provider in EventSourceName.
    - id: kusto_custom_security_fields
      type: field_name_mapping
      mapping:
          Provider_Name: EventSourceName
      rule_conditions:
          - type: logsource
            product: windows
            service: security
    # Windows System log rules query Sentinel's Event table, where Azure Monitor Agent
    # stores Windows event logs other than Security.
    - id: kusto_custom_system_table
      type: set_state
      key: query_table
      val: Event
      rule_conditions:
          - type: logsource
            product: windows
            service: system
    # The Event table keeps the event's provider in Source. Event data fields, including
    # the name of a cleared log in event 104, are only inside the EventData XML.
    - id: kusto_custom_system_fields
      type: field_name_mapping
      mapping:
          Provider_Name: Source
      rule_conditions:
          - type: logsource
            product: windows
            service: system
    # Firewall rules query Sentinel's CommonSecurityLog table, where the Palo Alto
    # Networks data connector stores PAN-OS logs sent as CEF. azure_monitor has no table
    # for `category: firewall`.
    - id: kusto_custom_firewall_table
      type: set_state
      key: query_table
      val: CommonSecurityLog
      rule_conditions:
          - type: logsource
            category: firewall
    # CommonSecurityLog holds CEF from every vendor, and the mappings below assume PAN-OS
    # values (`action` is allow, deny, drop, reset-client, ...), so scope the query to
    # Palo Alto, as Sentinel's own PAN-OS analytics rules do.
    - id: kusto_custom_firewall_vendor
      type: add_condition
      conditions:
          DeviceVendor: 'Palo Alto Networks'
      rule_conditions:
          - type: logsource
            category: firewall
    # Sigma's firewall fields (taxonomy appendix, plus `action` as SigmaHQ's firewall
    # rules use it) to the columns that CEF's src, spt, dst, dpt and act keys fill.
    # `username` isn't mapped: CEF's suser keeps PAN-OS's `domain\user`, while Elastic's
    # panw integration keeps only the user part, so one value can't match on both.
    - id: kusto_custom_firewall_fields
      type: field_name_mapping
      mapping:
          src_ip: SourceIP
          src_port: SourcePort
          dst_ip: DestinationIP
          dst_port: DestinationPort
          action: DeviceAction
      rule_conditions:
          - type: logsource
            category: firewall
