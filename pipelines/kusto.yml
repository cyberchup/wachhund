# Custom Kusto field mappings. Runs before the built-in pipelines (priority 5 vs
# microsoft_xdr's and azure_monitor's 10), so a mapping here overrides the built-in one.
#
# Add a mapping when tests/convert_rules.py reports a field the target table doesn't
# have. Map to a column of the table the rule converts to (the error lists them).
# Example:
#
#     - id: kusto_custom_process_creation
#       type: field_name_mapping
#       mapping:
#           SomeSigmaField: ProcessCommandLine
#       rule_conditions:
#           - type: logsource
#             category: process_creation
#             product: windows
name: custom_kusto
priority: 5
transformations:
    # Windows Security log rules query Sentinel's SecurityEvent table. azure_monitor only
    # picks a table from a rule's category (process_creation, ...), so a rule with
    # `service: security` needs the table set here.
    - id: kusto_custom_security_table
      type: set_state
      key: query_table
      val: SecurityEvent
      rule_conditions:
          - type: logsource
            product: windows
            service: security
    # SecurityEvent keeps the event's provider in EventSourceName.
    - id: kusto_custom_security_fields
      type: field_name_mapping
      mapping:
          Provider_Name: EventSourceName
      rule_conditions:
          - type: logsource
            product: windows
            service: security
    # Windows System log rules query Sentinel's Event table, where Azure Monitor Agent
    # stores Windows event logs other than Security.
    - id: kusto_custom_system_table
      type: set_state
      key: query_table
      val: Event
      rule_conditions:
          - type: logsource
            product: windows
            service: system
    # The Event table keeps the event's provider in Source. Event data fields, including
    # the name of a cleared log in event 104, are only inside the EventData XML.
    - id: kusto_custom_system_fields
      type: field_name_mapping
      mapping:
          Provider_Name: Source
      rule_conditions:
          - type: logsource
            product: windows
            service: system
