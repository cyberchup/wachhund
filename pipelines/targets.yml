# Conversion targets, read by tests/convert_rules.py.
#
# For each target, a rule uses the first route whose `when` matches its logsource
# (a route without `when` matches every rule). Pipelines run in priority order, not
# list order: the custom pipelines in this folder have lower priority numbers than the
# built-in ones, so they run first and their mappings win.
#
# `options` are passed to the pySigma backend, e.g. `index_names` for Elastic.
# `required: false` makes a target best-effort: its problems are reported in the CI
# summary but don't fail CI.

elastic:
    # EQL, not Lucene: EQL's `:` and `like~` compare strings case-insensitively, as Sigma
    # does. Lucene compares keyword and wildcard fields such as process.command_line
    # case-sensitively, so it missed `CERTUTIL -URLCACHE` and similar.
    backend: eql
    # Elastic Security rules carry the Sigma rule's author and license as rule fields,
    # so they need no attribution comments.
    format: siem_rule_ndjson
    extension: ndjson
    required: true
    # A field counts as mapped only if a field-mapping step other than these catch-alls
    # renamed it. ecs_windows sends every field it doesn't know to winlog.event_data.<Field>,
    # which often doesn't exist in Elastic data, so that alone isn't a mapping.
    require_mapped_fields: true
    fallback_items:
        - ecs_windows_winlog_eventdata_prefix
    routes:
        - when: {product: windows}
          pipelines: [pipelines/elastic.yml, ecs_windows]
        - when: {product: macos}
          pipelines: [pipelines/elastic.yml, ecs_macos_esf]
        - pipelines: [pipelines/elastic.yml]

kusto:
    backend: kusto
    format: default
    extension: kql
    required: true
    # A bare query has no rule metadata, so the file starts with comment lines giving the
    # rule's title, id, authors, license and URL, as DRL 1.1 requires
    # (CONVENTIONS.md, section 8).
    attribution_comment: '// {}'
    # The built-in Kusto pipelines reject fields that aren't valid for the target table,
    # so no extra mapping check is needed here.
    require_mapped_fields: false
    routes:
        # Windows Security event log: Sentinel's SecurityEvent table.
        - when: {product: windows, service: security}
          pipelines: [pipelines/kusto.yml, azure_monitor]
        # Windows System event log: Sentinel's Event table.
        - when: {product: windows, service: system}
          pipelines: [pipelines/kusto.yml, azure_monitor]
        # Everything else: Defender XDR advanced hunting tables (also queryable in Sentinel
        # through the Defender XDR connector). Unsupported logsources fail conversion.
        - pipelines: [pipelines/kusto.yml, microsoft_xdr]

splunk:
    backend: splunk
    format: default
    extension: spl
    required: false
    # The same attribution as Kusto, but at the end of the query: Splunk rejects a comment
    # in front of a generating command, and its docs don't say whether a query's implicit
    # `search` counts as one.
    attribution_comment: '```{}```'
    attribution_at: end
    # splunk_windows keeps Sigma's field names (the Windows event field names, such as
    # Image and CommandLine), so there's no mapping step to check. Whether Splunk has
    # those fields depends on how it indexes the events.
    require_mapped_fields: false
    routes:
        - when: {product: windows}
          pipelines: [pipelines/splunk.yml, splunk_windows]
        - pipelines: [pipelines/splunk.yml]
