id: cc77d0fa-a5aa-4db0-89dd-222a868b5988
description: |
    Positive samples: the vssadmin, wmic, wbadmin and resize atomics, ransomware-style shadow storage resizes, PowerShell deleting shadow copies through WMI and through diskshadow, and a renamed copy of vssadmin.
    Benign samples: listing and creating shadow copies, wbadmin get versions, and the cmd.exe parent of the vssadmin atomic.
