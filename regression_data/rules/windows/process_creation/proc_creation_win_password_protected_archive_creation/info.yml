id: 382a3cb5-bb49-480d-a8cd-3c483df2282e
description: |
    Positive samples: the three T1560.001 atomics (7z.exe u -p, Rar.exe a -hp, winzip64.exe -a -s), 7za.exe with AES and a ZIP target, a renamed 7z.exe staging a hauslab file share, Rar.exe and WinRAR.exe with -p and -hp, and wzzip.exe with -s.
    Benign samples: the same archivers creating archives without a password, extracting or listing password-protected archives, WinZip extracting with a password, and the 7-Zip file manager opening an archive.
