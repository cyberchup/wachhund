id: 87ca6b70-0659-4f05-a4cf-b8d32a86bc46
description: |
    Positive samples: the Discord and Teams PowerShell atomics as Invoke-AtomicTest starts them, curl uploading a file to a Discord webhook with a versioned API path, curl and Python posting to Slack webhooks, PowerShell posting to a Teams Workflows URL, and pwsh posting to a legacy Office 365 connector.
    Benign samples: Chrome opening Discord, curl querying Discord's gateway, PowerShell calling Slack's Web API and Microsoft Graph, Teams starting, and curl downloading from the Discord CDN.
