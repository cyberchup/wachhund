id: 1eac4ae8-6f66-44ec-87f5-ad45de0fa5b8
description: |
    Positive samples: the systemstatebackup atomic as cmd.exe launches it, an upper-case ransomware-style variant, slash-style switches from PowerShell, an explicit -backupTarget, and a renamed copy of wbadmin.
    Benign samples: routine retention with -keepVersions:3, deleting one dated version, starting a system state backup, wbadmin get versions, and the cmd.exe parent of the atomic.
date: 2026-10-13
author: cyberchup
