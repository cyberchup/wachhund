description: |
    Positive samples: the pastebin PowerShell atomic as Invoke-AtomicTest starts it, the curl file.io atomic, curl uploading with --upload-file, -sT, a form file, a form field read from a file and --data-urlencode, and PowerShell uploading with -InFile and WebClient.UploadFile.
    Benign samples: curl downloading from transfer.sh and pastebin, curl uploading to a hauslab server, PowerShell reading a paste and posting to another API, and Chrome opening WeTransfer.
