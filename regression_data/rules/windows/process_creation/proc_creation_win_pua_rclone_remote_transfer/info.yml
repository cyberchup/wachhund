id: aed31d96-0d0f-47c6-bfd8-a19e6e574407
description: |
    Positive samples: the Mega and FTP rclone atomics, a ransomware-style copy of a hauslab file share, sync to S3, move to Mega, bisync to Google Drive, a renamed rclone found by its file description, and a renamed rclone with SigmaHQ's option set.
    Benign samples: rclone version, config show, config create (the Mega atomic's first step), ls, lsd and check, robocopy, and cmd.exe copy.
