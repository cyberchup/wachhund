description: |
    Positive samples: the T1105 urlcache atomic as cmd.exe launches it, a download from an IP address, verifyctl, slash and en-dash flags, and a renamed copy of certutil.
    Benign samples: clearing the URL cache, a revocation check with -urlfetch, -hashfile and -decode, curl.exe downloading, and the atomic's cmd.exe parent.
